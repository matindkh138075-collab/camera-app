<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>ارسال عکس خودکار</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #0f172a;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding: 30px;
    }
    .box {
      max-width: 420px;
      margin: auto;
      background: #020617;
      padding: 20px;
      border-radius: 12px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      margin-top: 10px;
    }
    video {
      width: 100%;
      margin-top: 15px;
      border-radius: 10px;
    }
    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #22c55e;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>شرایط استفاده</h2>
    <p>
      با کلیک روی دکمه زیر، شما اجازه می‌دهید از دوربین دستگاه برای گرفتن تصویر
      استفاده شود و تصاویر به سرور ارسال گردد.
    </p>

    <button id="startBtn">می‌پذیرم و ادامه</button>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
    <div id="status"></div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    let stream;
    let intervalId;

    startBtn.onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;

        status.innerText = 'دوربین فعال شد ✅';
        startBtn.disabled = true;

        // هر 5 ثانیه عکس گرفته می‌شود
        intervalId = setInterval(async () => {
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          canvas.toBlob(async (blob) => {
            const form = new FormData();
            form.append('photo', blob, 'photo.jpg');

            try {
              await fetch('https://YOUR_SERVER_DOMAIN/upload', {
                method: 'POST',
                body: form
              });
              status.innerText = 'عکس ارسال شد ✅';
            } catch (e) {
              status.innerText = 'خطا در ارسال عکس ❌';
              console.error(e);
            }
          }, 'image/jpeg', 0.9);

        }, 5000);

      } catch (err) {
        alert('اجازه دسترسی به دوربین داده نشد');
        console.error(err);
      }
    };
  </script>

</body>
</html>
